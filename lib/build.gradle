plugins {
    id 'java-library'
}

group = 'frc.team5712'
version = '2.0.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

// A dependency-free jar with a fixed name, for the bench: java -cp lib/build/libs/pathcore.jar ...
tasks.named('jar') {
    archiveFileName = 'pathcore.jar'
}

tasks.named('test') {
    useJUnitPlatform()
    // The fixture test compares against ../fixtures; the performance test prints its timings
    systemProperty 'fixtures.dir', file('../fixtures').absolutePath
    testLogging {
        events 'failed'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}

// ---------------------------------------------------------------------------------- WPILib adapters
// src/wpilib/java: Pose2d/ChassisVelocities conversion, Commands v2 and v3 adapters, PathLibrary and
// telemetry. Built against WPILib 2027 from the installer's offline maven repo (override with
// -PwpilibMaven=<dir>). The core above never depends on it. Skipped, with a warning, if the repo is missing.
def wpilibVersion = '2027.0.0-alpha-7'
def wpilibMaven = file(project.findProperty('wpilibMaven') ?: 'C:/Users/Public/wpilib/2027_alpha7/maven')

sourceSets {
    wpilib {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    wpilibTest {
        compileClasspath += sourceSets.main.output + sourceSets.wpilib.output
        runtimeClasspath += sourceSets.main.output + sourceSets.wpilib.output
    }
    // Phase 6: every path authored in the editor (e2e/out), run through the WPILib adapters in simulation
    e2eTest {
        compileClasspath += sourceSets.main.output + sourceSets.wpilib.output
        runtimeClasspath += sourceSets.main.output + sourceSets.wpilib.output
        // the editor's generated names for that project, and the test that uses them, once it has been
        // authored (a fresh clone compiles without them)
        if (file('../e2e/out/robot-project/src/main/java/frc/robot/PathEditorNames.java').isFile()) {
            java.srcDir '../e2e/out/robot-project/src/main/java'
            java.srcDir 'src/e2eNames/java'
        }
    }
}

configurations {
    wpilibTestImplementation.extendsFrom wpilibImplementation, testImplementation
    wpilibTestRuntimeOnly.extendsFrom wpilibRuntimeOnly, testRuntimeOnly
    e2eTestImplementation.extendsFrom wpilibImplementation, testImplementation
    e2eTestRuntimeOnly.extendsFrom wpilibRuntimeOnly, testRuntimeOnly
}

if (wpilibMaven.isDirectory()) {
    repositories {
        maven { url = wpilibMaven.toURI() }
    }
    dependencies {
        // WPILib's poms list no dependencies, so every jar the adapters touch is named here
        wpilibImplementation "org.wpilib.wpimath:wpimath-java:$wpilibVersion"
        wpilibImplementation "org.wpilib.wpiutil:wpiutil-java:$wpilibVersion"
        wpilibImplementation "org.wpilib.wpiunits:wpiunits-java:$wpilibVersion"
        wpilibImplementation "org.wpilib.wpilibj:wpilibj-java:$wpilibVersion"
        wpilibImplementation "org.wpilib.hal:hal-java:$wpilibVersion"
        wpilibImplementation "org.wpilib.ntcore:ntcore-java:$wpilibVersion"
        wpilibImplementation "org.wpilib.datalog:datalog-java:$wpilibVersion"
        wpilibImplementation "org.wpilib.telemetry:telemetry-java:$wpilibVersion"
        wpilibImplementation "org.wpilib.tunables:tunables-java:$wpilibVersion"
        wpilibImplementation "org.wpilib:annotations-java:$wpilibVersion"
        wpilibImplementation "org.wpilib:commandsv3-java:$wpilibVersion"
        wpilibImplementation "org.wpilib.commandsv2:commandsv2-java:$wpilibVersion"
        // third-party jars WPILib loads at run time (versions as shipped in the installer)
        wpilibRuntimeOnly "us.hebi.quickbuf:quickbuf-runtime:1.4"
        wpilibRuntimeOnly "org.ejml:ejml-simple:0.46.0"
        wpilibRuntimeOnly "org.ejml:ejml-core:0.46.0"
        wpilibRuntimeOnly "org.ejml:ejml-ddense:0.46.0"
        // NetworkTables' telemetry backend writes topic properties as JSON (the NT4 harness needs it)
        wpilibRuntimeOnly "io.avaje:avaje-json-core:3.14"
        wpilibRuntimeOnly "io.avaje:avaje-jsonb:3.14"
        wpilibRuntimeOnly "io.avaje:avaje-spi-core:2.17"
    }
    // Desktop (simulation) natives for the adapter tests: the v3 scheduler asks the HAL for the op mode
    configurations { wpilibNatives }
    def nativeClassifier = 'windowsx86-64'
    ['org.wpilib.hal:hal-cpp', 'org.wpilib.wpiutil:wpiutil-cpp', 'org.wpilib.wpinet:wpinet-cpp',
     'org.wpilib.ntcore:ntcore-cpp', 'org.wpilib.datalog:datalog-cpp', 'org.wpilib.wpimath:wpimath-cpp'].each { lib ->
        dependencies.add('wpilibNatives', "$lib:$wpilibVersion:$nativeClassifier@zip")
    }
    def nativesDir = layout.buildDirectory.dir('wpilibNatives')
    tasks.register('extractWpilibNatives', Sync) {
        from { configurations.wpilibNatives.collect { zipTree(it) } }
        include '**/shared/*.dll', '**/shared/*.so', '**/shared/*.dylib'
        eachFile { path = name }
        includeEmptyDirs = false
        into nativesDir
    }
    tasks.register('wpilibTest', Test) {
        dependsOn 'extractWpilibNatives'
        systemProperty 'java.library.path', nativesDir.get().asFile.absolutePath
        group = 'verification'
        description = 'Tests the WPILib adapters.'
        testClassesDirs = sourceSets.wpilibTest.output.classesDirs
        classpath = sourceSets.wpilibTest.runtimeClasspath
        useJUnitPlatform()
        // Commands v3 runs commands as JDK continuations, which the robot JVM opens up the same way
        jvmArgs '--add-opens=java.base/jdk.internal.vm=ALL-UNNAMED', '--add-exports=java.base/jdk.internal.vm=ALL-UNNAMED',
            '--add-opens=java.base/java.lang=ALL-UNNAMED'

        testLogging {
            events 'failed'
            showStandardStreams = true
            exceptionFormat = 'full'
        }
    }
    tasks.named('check') { dependsOn 'wpilibTest' }
    // A real NT4 server with a simulated robot following a path, for the editor's live NT4 test
    // (editor/app: npm run test:nt4). -Pnt4Port (default 5810), -Pnt4Seconds (default 60).
    tasks.register('nt4Server', JavaExec) {
        dependsOn 'extractWpilibNatives'
        group = 'verification'
        description = 'Runs WPILib ntcore as an NT4 server with a PathFollower publishing its telemetry.'
        classpath = sourceSets.e2eTest.runtimeClasspath
        mainClass = 'frc.team5712.path.e2e.Nt4TelemetryServer'
        systemProperty 'java.library.path', nativesDir.get().asFile.absolutePath
        jvmArgs '--add-opens=java.base/jdk.internal.vm=ALL-UNNAMED', '--add-exports=java.base/jdk.internal.vm=ALL-UNNAMED',
            '--add-opens=java.base/java.lang=ALL-UNNAMED', '-Xmx256m'
        args((project.findProperty('nt4Port') ?: '5810').toString(), (project.findProperty('nt4Seconds') ?: '60').toString())
    }
    // Not part of check: it needs the editor to have authored e2e/out first (run tools/e2e.mjs)
    tasks.register('e2eTest', Test) {
        dependsOn 'extractWpilibNatives'
        systemProperty 'java.library.path', nativesDir.get().asFile.absolutePath
        systemProperty 'e2e.dir', file('../e2e/out').absolutePath
        systemProperty 'e2e.report', file('../e2e/RESULTS.md').absolutePath
        if (project.hasProperty('e2eTrace')) {
            systemProperty 'e2e.trace', project.property('e2eTrace')
        }
        group = 'verification'
        description = 'Runs every path the editor authored through the WPILib adapters in simulation.'
        testClassesDirs = sourceSets.e2eTest.output.classesDirs
        classpath = sourceSets.e2eTest.runtimeClasspath
        useJUnitPlatform()
        outputs.upToDateWhen { false }
        jvmArgs '--add-opens=java.base/jdk.internal.vm=ALL-UNNAMED', '--add-exports=java.base/jdk.internal.vm=ALL-UNNAMED',
            '--add-opens=java.base/java.lang=ALL-UNNAMED'
        testLogging {
            events 'failed'
            showStandardStreams = true
            exceptionFormat = 'full'
        }
    }
    tasks.register('wpilibJar', Jar) {
        description = 'The WPILib adapters, for a robot project that also depends on pathcore.jar.'
        archiveFileName = 'pathcore-wpilib.jar'
        from sourceSets.wpilib.output
    }
} else {
    logger.warn("WPILib maven repo not found at $wpilibMaven: the WPILib adapters are not compiled. " +
        "Pass -PwpilibMaven=<WPILib install>/maven.")
    tasks.named('compileWpilibJava') { enabled = false }
    tasks.named('compileWpilibTestJava') { enabled = false }
    tasks.named('compileE2eTestJava') { enabled = false }
}

// Regenerates the golden vectors in ../fixtures (commit the result)
tasks.register('fixtures', JavaExec) {
    group = 'verification'
    description = 'Writes fixtures/*.json, the vectors the TypeScript port must reproduce.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'frc.team5712.path.tools.FixtureGen'
    args file('../fixtures').absolutePath
}
